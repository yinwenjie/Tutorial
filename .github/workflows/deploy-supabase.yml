name: Deploy Supabase Remote

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Remote operation; dry-run is the safe default
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - verify
          - apply
      confirm_project_ref:
        description: Apply mode only; enter the exact target project ref
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate migrations locally
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.4

      - name: Validate remote deployment allowlist
        run: npm run verify:supabase-remote-config

      - name: Replay and test migrations locally
        run: npm run verify:supabase-preparation

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  deploy:
    name: Run protected remote operation
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_REMOTE_MODE: ${{ inputs.mode }}
      SUPABASE_REMOTE_CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
    steps:
      - name: Require master branch
        if: github.ref != 'refs/heads/master'
        run: |
          echo "Remote Supabase operations must run from refs/heads/master."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Validate remote deployment allowlist
        run: npm run verify:supabase-remote-config

      - name: Run remote migration workflow
        run: npm run deploy:supabase:remote
