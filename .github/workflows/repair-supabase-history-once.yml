name: Repair Supabase Migration History Once

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: Enter the exact production project ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  repair:
    name: Audit schema and align 001-019 history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_REMOTE_CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
    steps:
      - name: Require master branch
        if: github.ref != 'refs/heads/master'
        run: |
          echo "Migration history alignment must run from refs/heads/master."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Confirm exact project ref
        run: |
          if [ "$SUPABASE_REMOTE_CONFIRM_PROJECT_REF" != "$SUPABASE_PROJECT_ID" ]; then
            echo "Project-ref confirmation does not match the protected Environment target."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Link exact project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --yes

      - name: Show history before alignment
        run: supabase migration list --linked

      - name: Audit manually applied 001-019 schema
        run: >-
          supabase db query --linked --file
          supabase/checks/000_one_time_remote_history_alignment_audit.sql

      - name: Verify Phase 1.18.1 with rollback
        run: >-
          supabase db query --linked --file
          supabase/checks/021_admin_readonly_foundation_verify.sql

      - name: Mark exact migrations as applied
        run: >-
          supabase migration repair
          001 002 003 004 005 006 007 008 009
          010 011 012 013 014 015 016 017 018 019
          --status applied --linked --yes

      - name: Verify aligned history and schema
        run: >-
          supabase db query --linked --file
          supabase/checks/000_remote_migration_history_baseline.sql

      - name: Show history after alignment
        run: supabase migration list --linked
